services:
  frontend:
    image: ${IMAGE:-gym-saas-frontend:latest}
    container_name: gym-saas-frontend
    restart: unless-stopped
    ports:
      - '127.0.0.1:8081:80'
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://127.0.0.1/']
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s
